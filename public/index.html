<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Green Truth — Renewable Energy Party Game</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#10251c;background:#eef6f1}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 5%,#dff4e6,transparent 35%),linear-gradient(145deg,#f7fbf8,#e8f3ed)}
.wrap{max-width:1050px;margin:auto;padding:22px}.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.logo{font-weight:950;letter-spacing:-.05em;font-size:28px}.logo span{opacity:.5}.pill{padding:8px 12px;border-radius:999px;background:#fff;border:1px solid #d4e5db;font-size:12px;font-weight:800}
.card{background:rgba(255,255,255,.94);border:1px solid #d7e7dd;border-radius:24px;padding:28px;box-shadow:0 15px 45px rgba(30,70,48,.08)}.center{text-align:center}.hero{padding:55px 25px}.hero h1{font-size:clamp(40px,7vw,78px);line-height:.95;margin:10px 0}.hero p{max-width:650px;margin:18px auto;color:#52665c;font-size:18px}
input{width:100%;padding:15px 16px;border:1px solid #c9ddd0;border-radius:14px;font-size:16px;background:#fbfefc}button{border:0;border-radius:14px;padding:15px 20px;font-size:16px;font-weight:850;cursor:pointer;background:#173f2b;color:white;transition:.15s;box-shadow:0 7px 18px rgba(23,63,43,.15)}button:hover{transform:translateY(-1px)}button.secondary{background:#fff;color:#173f2b;border:1px solid #c9ddd0;box-shadow:none}
.stack{display:grid;gap:12px;max-width:420px;margin:25px auto}.room{font-size:42px;font-weight:950;letter-spacing:.15em;background:#f0f8f3;border:2px dashed #aacdb8;border-radius:18px;padding:14px;margin:20px auto;max-width:350px}.grid{display:grid;grid-template-columns:1.4fr .6fr;gap:18px}.players{display:grid;gap:9px;margin-top:15px}.player{display:flex;justify-content:space-between;padding:12px 14px;background:#f5faf7;border-radius:13px}.muted{color:#6a7d73}.small{font-size:13px}.topbar{display:flex;justify-content:space-between;gap:10px;align-items:center}.round{font-weight:900}.claim{font-size:clamp(25px,4vw,45px);line-height:1.08;margin:25px 0}.topic{display:inline-block;padding:7px 11px;border-radius:999px;background:#e1f2e7;color:#1d6941;font-weight:800;font-size:13px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}.real{background:#207a4a}.bluff{background:#b44747}.result{padding:18px;border-radius:17px;background:#eef8f1;margin-top:20px}.source{margin-top:14px;font-size:12px;color:#63776d}.source a{color:#206743}.winner{font-size:34px;font-weight:950;margin:20px 0}.footer{text-align:center;margin:22px;color:#75877e;font-size:12px}.error{background:#fff0f0;color:#8f3333;padding:12px;border-radius:12px;margin-top:15px}
@media(max-width:750px){.grid{grid-template-columns:1fr}.actions{grid-template-columns:1fr}.wrap{padding:14px}.card{padding:20px}}
</style>
</head>
<body><div class="wrap">
<div class="brand"><div class="logo">GREEN <span>TRUTH</span></div><div class="pill">2–8 PLAYERS · 5 ROUNDS</div></div>
<main id="app"></main><div class="footer">Green Truth • Evidence-based sustainability party game</div></div>
<script>
let ws=null,state=null,session=JSON.parse(localStorage.getItem("gtSession")||"null");
const app=document.getElementById("app");
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function connect(action,data){
  if(ws&&ws.readyState===1){ws.send(JSON.stringify({action,...data}));return;}
  ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
  ws.onopen=()=>ws.send(JSON.stringify({action,...data}));
  ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==="state"){state=m;session={...session,code:m.code,id:m.selfId};localStorage.setItem("gtSession",JSON.stringify(session));render();}if(m.type==="error")showError(m.message);};
  ws.onclose=()=>{if(state&&state.status!=="finished")showError("Connection lost. Refresh to reconnect.");};
}
function showError(msg){let x=document.getElementById("err");if(x)x.textContent=msg;else app.insertAdjacentHTML("afterbegin",`<div id="err" class="error">${esc(msg)}</div>`);}
function create(){const name=document.getElementById("name").value.trim();if(!name)return showError("Enter your name.");session={name};connect("create",{name});}
function join(){const name=document.getElementById("name").value.trim(),code=document.getElementById("code").value.trim().toUpperCase();if(!name||!code)return showError("Enter your name and room code.");session={name,code};connect("join",{name,code});}
function act(action,value){if(ws?.readyState===1)ws.send(JSON.stringify({action,value,code:state.code}));}
function leave(){if(ws?.readyState===1)ws.send(JSON.stringify({action:"leave",code:state.code}));localStorage.removeItem("gtSession");location.reload();}
function render(){if(!state)return home();if(state.status==="lobby")lobby();else if(state.status==="playing")game();else if(state.status==="results")results();else finished();}
function home(){app.innerHTML=`<section class="card hero"><div class="topic">RENEWABLE ENERGY • SUSTAINABILITY • SCIENCE</div><h1>Can you spot<br>the <i>Green Truth?</i></h1><p>Five fast rounds. One claim at a time. Decide whether the science is real evidence or a bluff.</p><div class="stack"><input id="name" maxlength="18" placeholder="Your nickname"><button onclick="create()">Create a Room</button><div class="muted">or join a friend's room</div><input id="code" maxlength="6" placeholder="ROOM CODE" style="text-transform:uppercase;text-align:center;letter-spacing:.2em"><button class="secondary" onclick="join()">Join Room</button></div></section>`;}
function lobby(){const host=session.id===state.hostId;app.innerHTML=`<section class="grid"><div class="card center"><div class="topic">ROOM READY</div><h2>Invite your players</h2><div class="room">${esc(state.code)}</div><p class="muted">Share the code. Players can join from their own phones or computers.</p>${host?`<button onclick="act('start')" ${state.players.length<2?"disabled":""}>Start Game</button>`:`<div class="pill">Waiting for the host to start…</div>`}<p class="small muted">${state.players.length}/8 players · minimum 2</p></div><div class="card"><h3>Players</h3><div class="players">${state.players.map((p,i)=>`<div class="player"><span>${i===0?"👑 ":""}${esc(p.name)}</span><b>${p.score}</b></div>`).join("")}</div><button class="secondary" style="margin-top:18px;width:100%" onclick="leave()">Leave Room</button></div></section>`;}
function game(){const q=state.question,me=state.players.find(p=>p.id===session.id);app.innerHTML=`<section class="grid"><div class="card"><div class="topbar"><div class="round">ROUND ${state.round} / 5</div><div>${state.round===5?"⚡ 200 POINTS":"100 POINTS"}</div></div><div style="margin-top:20px" class="topic">${esc(q.topic)}</div><div class="claim">“${esc(q.claim)}”</div><p class="muted">Is this claim supported by scientific evidence?</p>${me?.answered?`<div class="result"><b>Answer locked.</b><p>Waiting for the other players…</p></div>`:`<div class="actions"><button class="real" onclick="act('answer',true)">✓ REAL EVIDENCE</button><button class="bluff" onclick="act('answer',false)">✕ BLUFF</button></div>`}</div><div class="card"><h3>Live Scores</h3><div class="players">${[...state.players].sort((a,b)=>b.score-a.score).map(p=>`<div class="player"><span>${esc(p.name)}${p.id===session.id?" (you)":""}</span><b>${p.score}</b></div>`).join("")}</div></div></section>`;}
function results(){const q=state.question,me=state.players.find(p=>p.id===session.id),correct=me?.answered&&state.reveal.correct!==undefined;app.innerHTML=`<section class="grid"><div class="card center"><div class="topic">ROUND ${state.round} RESULT</div><h2>${state.reveal.correct?"🟢 REAL EVIDENCE":"🔴 BLUFF"}</h2><div class="claim">“${esc(q.claim)}”</div><div class="result"><b>THE SCIENCE</b><p>${esc(state.reveal.explanation)}</p></div><div class="source">Source: <a href="${esc(state.reveal.url)}" target="_blank" rel="noopener">${esc(state.reveal.source)}</a></div>${session.id===state.hostId?`<button style="margin-top:22px" onclick="act('next')">${state.round===5?"See Final Results":"Next Round →"}</button>`:`<p class="muted">Waiting for the host to continue…</p>`}</div><div class="card"><h3>Leaderboard</h3><div class="players">${[...state.players].sort((a,b)=>b.score-a.score).map(p=>`<div class="player"><span>${esc(p.name)}</span><b>${p.score}</b></div>`).join("")}</div></div></section>`;}
function finished(){const ps=[...state.players].sort((a,b)=>b.score-a.score),top=ps[0]?.score||0,winners=state.winner||[];app.innerHTML=`<section class="card hero"><div class="topic">GAME COMPLETE</div><div class="winner">${winners.length===1?"🏆 "+esc(winners[0]):"🤝 TIE GAME"}</div><p class="muted">${winners.length===1?"Green Truth Champion!":"The top players finished level."}</p><div style="font-size:42px;font-weight:950">${top} <span class="small">points</span></div><div class="players" style="max-width:500px;margin:25px auto">${ps.map((p,i)=>`<div class="player"><span>${i+1}. ${esc(p.name)}</span><b>${p.score}</b></div>`).join("")}</div><button onclick="location.reload()">Play Again</button></section>`;}
render();
</script></body></html>
